name: key-sync-qfa
# QI族中继 · 源仓vci-qfa持有GH_PAT_QI_FULL · 名值分离 · 事件驱动(零schedule)
on:
  workflow_dispatch:
    inputs:
      names_csv:
        required: false
      targets_csv:
        required: false
      rename_json:
        required: false
      sync_var:
        required: false
        default: '0'
  repository_dispatch:
    types: [key-sync]
permissions:
  contents: write
concurrency: key-sync-qfa
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
        SYNC_PAT: ${{ secrets.AI_FULL_PAT }}
        IN_NAMES: ${{ inputs.names_csv }}
        IN_TARGETS: ${{ inputs.targets_csv }}
        IN_RENAME: ${{ inputs.rename_json }}
        IN_SYNC_VAR: ${{ inputs.sync_var || '0' }}
        GH_PAT_QI_FULL: ${{ secrets.GH_PAT_QI_FULL }}
    steps:
      - uses: actions/checkout@v4
      - name: QI族中继·再密封分发（值仅经内存）
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/chepin-ai/vci-qfa.git
          pip install -q pynacl
          python3 ci/key_sync.py
