name: QFA-TOWER-01
on:
  # CRON-BAN-02 扩执：普查漏网第二例，同律卸除（cisvr-241 律延展，lvlu 代刀 20260910）
  # 事驱五道自足；钟驱非自持，事驱方自持。
  push:
    paths: ['inbox/**', 'ci/qfa_tower.py', '.github/workflows/qfa-tower.yml']
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [qfa-wake, qfa-tower-cascade, qfa-tower-kick, federation-event]
  workflow_dispatch:
    inputs:
      selftest:
        description: 'run selftest only'
        required: false
        default: 'no'

permissions:
  contents: write
  actions: write

concurrency:
  group: qfa-tower-${{ github.event_name == 'repository_dispatch' && 'chain' || 'edge' }}
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}

jobs:
  tower:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: qfa-tower --once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE_PAT: ${{ secrets.CI_OPS_LINE_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 ci/qfa_tower.py

  mesh-wake:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: mesh-wake hub
        env:
          MESH_PAT: ${{ secrets.CI_OPS_LINE_KEY }}
        run: |
          [ -n "$MESH_PAT" ] || { echo "no hub key, skip"; exit 0; }
          curl -sS -m 20 -X POST -H "Authorization: token $MESH_PAT" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/chepin-ai/ci-worker-01/dispatches \
            -d '{"event_type":"federation-event","client_payload":{"src":"qfa-tower","kind":"mesh-wake","sha":"${{ github.sha }}"}}' \
            -o /dev/null -w "mesh-wake http=%{http_code}\n" || true
