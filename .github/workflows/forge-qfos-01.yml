name: forge-qfos-01
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [init, sync]
      beat_note:
        required: false
        default: "{}"
permissions:
  contents: write
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forge qfa-os in chepin-qi
        env:
          QI: ${{ secrets.GH_PAT_QI_FULL }}
          MODE: ${{ inputs.mode }}
          NOTE: ${{ inputs.beat_note }}
        run: bash "$GITHUB_WORKSPACE/forge/scripts/forge.sh"
