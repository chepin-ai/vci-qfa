name: forge-qfos-01
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [init, sync]
      beat_note:
        required: false
        default: "{}"
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forge qfa-os in chepin-qi
        env:
          QI: ${{ secrets.GH_PAT_QI_FULL }}
          MODE: ${{ inputs.mode }}
          NOTE: ${{ inputs.beat_note }}
        run: |
          set -euo pipefail
          REPO=chepin-qi/qfa-os
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $QI" https://api.github.com/repos/$REPO)
          created=false
          if [ "$code" = "404" ]; then
            curl -s -X POST -H "Authorization: token $QI" -H "Accept: application/vnd.github+json"               https://api.github.com/user/repos -d '{"name":"qfa-os","private":true,"description":"QF-OS qfa line residence"}' > /tmp/create.json
            created=true
            sleep 3
          elif [ "$code" != "200" ]; then
            echo "repo check failed: $code"; exit 1
          fi
          rm -rf /tmp/qfaos
          if git clone --depth 1 "https://x-access-token:${QI}@github.com/${REPO}.git" /tmp/qfaos 2>/tmp/clone.err; then
            cd /tmp/qfaos
          else
            mkdir -p /tmp/qfaos && cd /tmp/qfaos && git init -b main .
            git remote add origin "https://x-access-token:${QI}@github.com/${REPO}.git"
          fi
          git config user.name qfa-forge && git config user.email qfa-forge@local
          rsync -a --delete "$GITHUB_WORKSPACE/forge/qfa-os/" . --exclude .git
          # engine self-test (交验): run all verifiers, collect exit codes
          cd engine/bound-proof
          pip install numpy -q 2>/dev/null || true
          echo '{}' > /tmp/vres.json
          for v in verify_bound*.py; do
            if python3 "$v" > "/tmp/${v}.log" 2>&1; then st=0; else st=$?; fi
            python3 - "$v" "$st" <<'EOF'
          import json, sys
          d = json.load(open('/tmp/vres.json')); d[sys.argv[1]] = int(sys.argv[2]); json.dump(d, open('/tmp/vres.json','w'))
EOF
          done
          cd /tmp/qfaos
          git add -A
          if git diff --cached --quiet; then changed=false; else
            git commit -m "forge-qfos-01 ${MODE} beat-127 [skip ci]" > /dev/null; changed=true
          fi
          if [ "$created" = "true" ] || [ "$changed" = "true" ]; then
            git push origin HEAD:main 2>/tmp/push.err || git push -u origin HEAD:main
          fi
          tip=$(git rev-parse HEAD)
          cd "$GITHUB_WORKSPACE"
          mkdir -p receipts/forge-qfos
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          python3 - "$TS" "$MODE" "$created" "$changed" "$tip" <<'EOF'
          import json, sys, hashlib, os
          ts, mode, created, changed, tip = sys.argv[1:6]
          vres = json.load(open('/tmp/vres.json'))
          rec = {"id":"FORGE-QFOS-01","ts":ts,"mode":mode,"repo":"chepin-qi/qfa-os","private":True,
                 "created": created=="true","changed": changed=="true","tip": tip,
                 "engine_selftest": vres,
                 "engine_selftest_pass": all(v==0 for v in vres.values()) if vres else None,
                 "note": json.load(open('/dev/stdin')) if False else None}
          import sys as s
          note = json.loads(os.environ.get('NOTE','{}'))
          rec['note'] = note
          path = f"receipts/forge-qfos/FQ-{ts}.json"
          json.dump(rec, open(path,'w'), ensure_ascii=False, indent=1, sort_keys=True)
          print(path)
EOF
          git config user.name qfa-forge && git config user.email qfa-forge@local
          git add receipts/forge-qfos && git commit -m "forge-qfos receipt $TS [skip ci]" > /dev/null
          git push
